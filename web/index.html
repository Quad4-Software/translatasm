<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>translatasm - Fast offline translation in your browser</title>
  <meta name="description" content="Offline neural machine translation in your browser via Bergamot WASM. 27 languages, 52 packs. Text stays on device. Nothing is uploaded.">
  <meta name="keywords" content="offline translator, browser translation, Bergamot, Marian NMT, WASM, privacy, on-device translation">
  <meta name="author" content="Quad4 Software">
  <meta name="robots" content="index, follow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="translatasm">
  <link rel="canonical" href="https://translatasm.quad4.io/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="translatasm">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="https://translatasm.quad4.io/">
  <meta property="og:title" content="translatasm - Fast offline translation">
  <meta property="og:description" content="Offline neural machine translation in your browser via Bergamot WASM. 27 languages. Nothing is uploaded.">
  <meta property="og:image" content="https://translatasm.quad4.io/icons/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="translatasm - Fast offline translation in your browser">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="translatasm - Fast offline translation">
  <meta name="twitter:description" content="Offline neural machine translation in your browser via Bergamot WASM. 27 languages. Nothing is uploaded.">
  <meta name="twitter:image" content="https://translatasm.quad4.io/icons/og-image.png">
  <meta name="twitter:image:alt" content="translatasm - Fast offline translation in your browser">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "translatasm",
    "url": "https://translatasm.quad4.io/",
    "description": "Offline neural machine translation in your browser via Bergamot WASM. 27 languages. Nothing is uploaded.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires a modern browser with WebAssembly support.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "creator": {
      "@type": "Organization",
      "name": "Quad4 Software",
      "url": "https://github.com/Quad4-Software"
    },
    "license": "https://github.com/Quad4-Software/translatasm/blob/master/LICENSE"
  }
  </script>
</head>
<body>
  <a class="source-link" href="https://github.com/Quad4-Software/translatasm" rel="noopener noreferrer" target="_blank">Source</a>
  <div class="atmosphere" aria-hidden="true"></div>
  <main class="stage">
    <header class="brand-block">
      <p class="brand">translatasm</p>
      <h1 class="headline">Fast offline translation.</h1>
      <p class="lede">Marian tiny packs via Bergamot WASM. Auto-detect, glossary, files, offline dict. Nothing is uploaded.</p>
    </header>

    <section class="controls" aria-label="Translator">
      <div class="lang-row">
        <label class="field">
          <span>From</span>
          <select id="from"></select>
        </label>
        <button type="button" id="btn-swap" class="ghost swap" title="Swap languages" aria-label="Swap languages">
          <span aria-hidden="true">Swap</span>
        </button>
        <label class="field">
          <span>To</span>
          <select id="to"></select>
        </label>
      </div>

      <div class="mode-row" aria-label="Modes">
        <label class="check">
          <input type="checkbox" id="opt-auto">
          <span>Auto detect</span>
        </label>
        <label class="check">
          <input type="checkbox" id="opt-html">
          <span>HTML</span>
        </label>
        <label class="check">
          <input type="checkbox" id="opt-align">
          <span>Align</span>
        </label>
      </div>

      <div class="pair-grid" id="pair-grid">
        <label class="field grow">
          <span class="pane-head">
            <span id="source-label">Source</span>
            <span id="source-count" class="count">0</span>
          </span>
          <textarea id="source" rows="10" placeholder="Type, paste, or drop a .txt / .md / .srt file" spellcheck="true" autofocus></textarea>
          <div id="source-align" class="align-pane" hidden></div>
        </label>
        <label class="field grow">
          <span class="pane-head">
            <span id="target-label">Translation</span>
            <span id="latency" class="count"></span>
          </span>
          <textarea id="target" rows="10" readonly placeholder="Translation appears here"></textarea>
          <div id="target-align" class="align-pane" hidden></div>
        </label>
      </div>

      <div class="cta-row">
        <button type="button" id="btn-translate" class="cta primary">
          <svg class="cta-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.64-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-1.04zM18.5 10h-2L12 22h2l1.12-3h6.26L22.5 22h2l-4.5-12zm-1.53 7l1.53-4.11L20.03 17h-3.06z"/>
          </svg>
          Translate
        </button>
        <button type="button" id="btn-copy" class="cta secondary" disabled>Copy</button>
        <button type="button" id="btn-link" class="cta secondary">Copy link</button>
        <button type="button" id="btn-clear" class="cta secondary" disabled>Clear</button>
        <button type="button" id="btn-file" class="cta secondary">Open file</button>
        <button type="button" id="btn-download" class="cta secondary" disabled>Download</button>
        <button type="button" id="btn-dict" class="cta secondary" data-dict-toggle aria-expanded="false" aria-controls="dict-panel">Dictionary</button>
        <input id="file-input" type="file" accept=".txt,.md,.markdown,.srt,text/plain,text/markdown" hidden>
      </div>

      <div class="status-row">
        <span id="spinner" class="spinner" hidden aria-hidden="true"></span>
        <p id="status" class="status" role="status">Getting ready...</p>
        <p id="route" class="route" hidden></p>
      </div>
      <div class="progress-track" hidden>
        <div id="progress" class="progress-bar"></div>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>
  </main>

  <div id="dict-root" class="dict-root">
    <aside id="dict-panel" class="dict-panel" data-dict-panel aria-hidden="true" aria-label="Offline dictionary">
      <header class="dict-panel-head">
        <h2 class="dict-title">Dictionary</h2>
        <button type="button" class="ghost dict-close" data-dict-close aria-label="Close dictionary">Close</button>
      </header>
      <form class="dict-form" data-dict-form>
        <label class="field grow">
          <span>Look up</span>
          <input id="dict-input" type="search" data-dict-input placeholder="Word" autocomplete="off" spellcheck="false">
        </label>
        <button type="submit" class="cta secondary">Go</button>
      </form>
      <p class="dict-status" data-dict-status role="status">Search a word below.</p>
      <p class="dict-packs" data-dict-packs></p>
      <div class="dict-result" data-dict-result></div>
      <button type="button" class="cta secondary dict-save" data-dict-save disabled>Save to vocab</button>

      <section class="dict-vocab-block" aria-label="Saved vocabulary">
        <h3 class="dict-sub">Vocab</h3>
        <div class="dict-tool-row">
          <button type="button" class="ghost" data-vocab-export>Export</button>
          <button type="button" class="ghost" data-vocab-import>Import</button>
          <button type="button" class="ghost" data-vocab-review>Review</button>
          <input type="file" accept="application/json,.json,.csv,text/csv" data-vocab-file hidden>
        </div>
        <div data-dict-vocab></div>
        <div class="dict-review" data-vocab-review-panel hidden>
          <p data-review-prompt></p>
          <p data-review-answer hidden></p>
          <div class="dict-tool-row">
            <button type="button" class="cta secondary" data-review-show>Show</button>
            <button type="button" class="cta secondary" data-review-again disabled>Again</button>
            <button type="button" class="cta secondary" data-review-good disabled>Good</button>
          </div>
        </div>
      </section>

      <section class="dict-gloss-block" aria-label="Term glossary">
        <h3 class="dict-sub">Glossary</h3>
        <form class="dict-gloss-form" data-gloss-form>
          <input type="text" data-gloss-source placeholder="Source term" required>
          <input type="text" data-gloss-target placeholder="Keep as" required>
          <button type="submit" class="cta secondary">Add</button>
        </form>
        <div class="dict-tool-row">
          <button type="button" class="ghost" data-gloss-export>Export</button>
          <button type="button" class="ghost" data-gloss-import>Import</button>
          <input type="file" accept="application/json,.json" data-gloss-file hidden>
        </div>
        <div data-gloss-list></div>
      </section>

      <p class="dict-attr" data-dict-attr></p>
    </aside>
  </div>

  <footer class="site-foot">
    <a href="https://github.com/Quad4-Software/translatasm/blob/master/LICENSE" rel="noopener noreferrer" target="_blank">0BSD</a>
    <a href="https://github.com/Quad4-Software" rel="noopener noreferrer" target="_blank">Quad4</a>
  </footer>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
