# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node@v7.1.0               949feb2413d6458794dcd2491c4babbbce0c15c1
#   actions/upload-artifact@v7.0.2          cf430e030ddbb5b0abf93d22962f4752f3646cd9
#
# Secure use: least-privilege GITHUB_TOKEN, pin actions to full commit SHAs,
# pull_request (not pull_request_target), no untrusted checkout with secrets.
# https://docs.github.com/en/actions/reference/security/secure-use

name: Screenshots

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page URL to capture (empty uses the live site default)
        required: false
        default: ""
      local:
        description: Serve ./web locally instead of a remote URL
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Capture screenshots
        env:
          SCREENSHOT_URL: ${{ inputs.url }}
          SCREENSHOT_LOCAL: ${{ inputs.local && '1' || '' }}
          PLAYWRIGHT_INSTALL_ARGS: --with-deps
          CHROME_PATH: ""
        run: make screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
