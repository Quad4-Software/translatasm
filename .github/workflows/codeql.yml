# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                      3d3c42e5aac5ba805825da76410c181273ba90b1
#   github/codeql-action/init@v4.39.3             33d7b85da1a04171e211befe2c739303b9a4c066
#   github/codeql-action/autobuild@v4.39.3        33d7b85da1a04171e211befe2c739303b9a4c066
#   github/codeql-action/analyze@v4.39.3          33d7b85da1a04171e211befe2c739303b9a4c066
#   step-security/harden-runner@v2.22.4           1d88384fd173af6ecb012dfd0264a306b711241a
#
# Secure use: least-privilege GITHUB_TOKEN, SHA-pinned actions, no pull_request_target.
# https://docs.github.com/en/actions/reference/security/secure-use

name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "28 7 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}

      - name: Autobuild
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
