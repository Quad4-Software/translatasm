# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/upload-artifact@v7.0.2           cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   ossf/scorecard-action@v2.5.0            fa7117db83c52d787ae5a89f350999701505d78e
#   github/codeql-action/upload-sarif@v4.39.3 33d7b85da1a04171e211befe2c739303b9a4c066
#
# Hardens supply-chain checks against pwn-request / tag-move / secret-dump
# patterns (tj-actions, prt-scan). No pull_request_target. SHA-pinned only.
# https://docs.github.com/en/actions/reference/security/secure-use
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write  # upload the SARIF report to code scanning
      id-token: write         # authenticate scorecard API calls
      contents: read
      actions: read           # read workflow run metadata for checks

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
