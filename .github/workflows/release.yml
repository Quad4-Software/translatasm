# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                   3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go@v7.0.0                   b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   actions/setup-node@v7.1.0                 949feb2413d6458794dcd2491c4babbbce0c15c1
#   goreleaser/goreleaser-action@v7.3.0       a4f02ab5355a589de60d917a659ce617ed19b3de
#   docker/setup-qemu-action@v4.4.0           99012661954931238ded8c8b007157a8430204e1
#   docker/setup-buildx-action@v4.4.1         f87e5991a6d7451dcb8d9637bfbc97413f497069
#   docker/login-action@v4.8.0                8aa5831fb8d48d8f76594c7ddde61ae58019f550
#   docker/metadata-action@v6.2.0             dc802804100637a589fabce1cb79ff13a1411302
#   docker/build-push-action@v7.4.0           c3c9e263c25d99ce0380d002d59b67737d91b0dc
#   sigstore/cosign-installer@v4.1.3           756fe2d284c7292c4e9b62c8a28f1e5629c59532
#   anchore/sbom-action/download-syft@v0.24.3  66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
#
# Immutable releases: all assets (binaries, checksums, CycloneDX SBOM,
# cosign checksum bundle) are published in one GoReleaser step. Do not
# gh release upload after publish (assets become read-only).
# Secure use: least-privilege GITHUB_TOKEN, pin actions to full commit SHAs,
# no pull_request_target, untrusted input via env (not inline shell).
# https://docs.github.com/en/actions/reference/security/secure-use

name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Leave empty to use latest tag or VERSION."
        required: false
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: quad4-software/translatasm

jobs:
  goreleaser:
    name: Binaries
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release and upload assets
      id-token: write      # cosign keyless signing via Fulcio
      attestations: write  # SLSA provenance attestations
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Disabled: release artifacts must not be built from a restorable
          # build cache (zizmor cache-poisoning). Module cache is empty anyway.
          cache: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          # Keep release builds free of restorable package-manager caches.
          package-manager-cache: false

      - name: Build browser extensions
        run: make extensions

      - name: Install Cosign
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Syft
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.0"
          args: >-
            release --clean
            ${{ github.ref_type != 'tag' && '--snapshot --skip=publish --skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"

  docker:
    name: Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push the image to GHCR
      id-token: write       # keyless cosign signing via Fulcio
      attestations: write   # build provenance attestations
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            RAW="$INPUT_TAG"
            VER="${RAW#v}"
          elif [ "$REF_TYPE" = "tag" ]; then
            RAW="$REF_NAME"
            VER="${RAW#v}"
          elif [ "$REF_NAME" = "master" ]; then
            SHORT="${GITHUB_SHA_FULL:0:12}"
            RAW="master"
            VER="0.0.0-master.${SHORT}"
          else
            RAW="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.1.0)"
            VER="${RAW#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${RAW}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA_FULL}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.meta.outputs.tag }},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.meta.outputs.tag }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || (github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
