# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.0              9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   actions/configure-pages@v5           983d7736d9b0ae728b81ab479565c72886d7745b
#   actions/upload-pages-artifact@v3.0.1 56afc609e74202658d3ffba0e8f6dda462b719fa
#   actions/deploy-pages@v4.0.5          d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
#   actions/setup-go@v6                  924ae3a1cded613372ab5595356fb5720e22ba16
#
# Secure use: least privilege, SHA-pinned actions, no pull_request_target.
# https://docs.github.com/en/actions/reference/security/secure-use

name: Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch offline assets (Bergamot S3, no extras)
        env:
          TRANSLATASM_EXTRAS: "0"
        run: make assets

      - name: Write static catalog
        run: go run ./cmd/gencatalog -o web/catalog.json

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
